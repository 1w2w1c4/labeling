[project]
name = "defect-labeler-backend"
version = "0.1.0"
description = "AVI 缺點偵測框圖標註系統：後端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymongo>=4.13",          # 使用 PyMongo 內建的 async API（Motor 已停止維護）
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 模擬模式（DL_DEMO=1）：記憶體 Mongo + 記憶體 Redis
demo = [
    "mongomock>=4.3",
    "fakeredis[lua]>=2.23",
]
dev = [
    "defect-labeler-backend[demo]",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
