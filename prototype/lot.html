<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lot 圖片清單</title>
<link rel="stylesheet" href="common.css">
<style>
  .page { max-width: 1440px; margin: 0 auto; padding: 16px 20px 40px; }
  @media (max-width: 640px) { .page { padding: 12px 16px 32px; } }
  .crumb { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .crumb a { color: var(--muted); text-decoration: none; }
  .crumb a:hover { color: var(--primary); }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
  }

  /* Lot 概要 */
  .lot-head { padding: 18px 20px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .lot-title { font-size: 22px; font-weight: 700; margin-right: 8px; }
  .lot-meta { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .lot-prog { flex: 1; min-width: 260px; }
  .lot-prog .top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
  .lot-actions { display: flex; gap: 10px; }

  /* 篩選 */
  .filters { margin-top: 12px; padding: 12px 20px; }
  .frow { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0; }
  .frow + .frow { border-top: 1px dashed var(--border); }
  .flabel { width: 76px; flex: none; font-size: 13px; color: var(--muted); padding-top: 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 11px;
    font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; line-height: 20px;
  }
  .chip:hover { border-color: var(--primary); }
  .chip .cnt { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chip.zero { opacity: .45; }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .chip.active .cnt { color: rgba(255,255,255,.8); }
  .chip .sw { width: 10px; height: 10px; border-radius: 3px; }
  .chip.inactive .nm::after { content: "（停用）"; color: var(--muted); font-size: 12px; }
  .chip.active.inactive .nm::after { color: rgba(255,255,255,.75); }
  .fcombo { display: inline-block; width: 230px; }
  .fcombo .combo-in { height: 28px; border-radius: 999px; font-size: 13px; padding: 0 12px; }

  /* 工具列 */
  .toolbar {
    position: sticky; top: 56px; z-index: 4; background: var(--bg);
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 0; font-size: 14px;
  }
  .toolbar .muted { color: var(--muted); }
  .toolbar a { cursor: pointer; text-decoration: none; margin-left: 8px; font-size: 13px; }
  .tools { display: flex; align-items: center; gap: 14px; }
  .switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; color: var(--muted); user-select: none; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; padding: 4px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }

  /* 虛擬捲動格狀清單 */
  .vgrid { position: relative; }
  .item {
    position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; cursor: pointer; transition: border-color .12s, box-shadow .12s;
  }
  .item:hover { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
  .thumb { position: relative; background: #0e2a1e; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .bx { position: absolute; border: 2px solid; border-radius: 1px; pointer-events: none; }
  .bx.dim { opacity: .25; }
  .hide-boxes .bx { display: none; }
  .lock, .idx {
    position: absolute; font-size: 11.5px; padding: 1px 7px; border-radius: 6px; font-weight: 600;
    background: rgba(0,0,0,.65); color: #fff; backdrop-filter: blur(2px);
  }
  .lock { top: 6px; right: 6px; }
  .idx { bottom: 6px; left: 6px; font-weight: 500; background: rgba(0,0,0,.5); }
  .info { padding: 7px 10px 9px; }
  .r1 { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12.5px; }
  .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nbx { color: var(--muted); white-space: nowrap; font-size: 12px; }
  .r2 { display: flex; align-items: center; gap: 8px; margin-top: 5px; overflow: hidden; }
  .r2 .badge { font-size: 11px; padding: 0 7px; flex: none; }
  .r2 .ai { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .r2 .ai .sc { font-variant-numeric: tabular-nums; }
  
  .more { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 0 8px; display: flex; justify-content: center; align-items: center; gap: 8px; }
  .empty { text-align: center; padding: 72px 16px; color: var(--muted); }
  .empty .btn { margin-top: 14px; }
</style>
</head>
<body>
<header class="app"></header>

<div class="page" id="page">
  <nav class="crumb"><a href="index.html">主頁</a> › Lot 圖片清單</nav>
  <div id="content"></div>
</div>

<script src="common.js"></script>
<script>
renderHeader();

const params = new URLSearchParams(location.search);
const LOT = (params.get('lot') || '').toUpperCase();
const lot = LOT_RE.test(LOT) ? getLot(LOT) : null;

if (!lot || lot.status === 'new') {
  const why = !LOT_RE.test(LOT) ? `Lot 編號「${esc(LOT || '（空白）')}」格式不正確。`
            : !lot ? `找不到 Lot「${esc(LOT)}」。` : `Lot「${esc(LOT)}」尚未開啟，請先回主頁開啟。`;
  $('content').innerHTML = `<div class="panel empty"><div style="font-size:16px;color:var(--text)">${why}</div>
    <a class="btn btn-primary" href="index.html">回主頁</a></div>`;
  throw new Error('stop');
}
document.title = `${LOT} · 圖片清單`;
const GO_QUEUE = params.get('queue') === '1';

const W = lot.width, H = lot.height;
const items = genItems(LOT, lot);
const THUMBS = makeThumbs();

/* ---------- 版面 ---------- */
const p = (n) => (n / lot.count * 100) + '%';
$('content').innerHTML = `
  <section class="panel lot-head">
    <div>
      <div><span class="lot-title mono">${LOT}</span><span class="badge ${lot.status === 'open' ? 'b-green' : 'b-blue'}">${lot.status === 'open' ? '已開啟' : '標註中'}</span></div>
      <div class="lot-meta">${lot.product} · ${lot.station} · ${fmt(lot.count)} 張 · ${lot.online} 人線上</div>
    </div>
    <div class="lot-prog">
      <div class="top"><span>標註進度</span><span>${fmt(lot.done)} / ${fmt(lot.count)}（${(lot.done / lot.count * 100).toFixed(1)}%）</span></div>
      <div class="progress">
        <div style="width:${p(lot.ng)};background:var(--danger)"></div>
        <div style="width:${p(lot.ok)};background:var(--ok)"></div>
      </div>
      <div class="legend">
        <span><i class="dot" style="background:var(--danger)"></i>NG ${fmt(lot.ng)}</span>
        <span><i class="dot" style="background:var(--ok)"></i>OK ${fmt(lot.ok)}</span>
        <span><i class="dot" style="background:var(--border)"></i>未標 ${fmt(lot.count - lot.done)}</span>
      </div>
    </div>
    <div class="lot-actions">
      <button class="btn btn-ghost" onclick="toast('前往 /stats?lots=${LOT}（尚未製作）')">此 Lot 缺點統計</button>
      <button class="btn btn-primary" onclick="startQueue()">開始標註</button>
    </div>
  </section>

  <section class="panel filters">
    <div class="frow"><span class="flabel">判定</span><div class="chips" id="f-verdict"></div></div>
    <div class="frow"><span class="flabel">缺點類別</span><div class="chips" id="f-class_id"></div></div>
    <div class="frow"><span class="flabel">AI 結果</span><div class="chips" id="f-ai"></div></div>
    <div class="frow"><span class="flabel">AI vs 人工</span><div class="chips" id="f-ai_cmp"></div></div>
  </section>

  <div class="toolbar">
    <div><span id="resultTxt"></span><a id="clearBtn">清除篩選</a></div>
    <div class="tools">
      <label class="switch"><input type="checkbox" id="showBoxes" checked>顯示框</label>
      <div class="seg" id="density"><button data-d="s">小</button><button data-d="m">中</button><button data-d="l">大</button></div>
    </div>
  </div>

  <div class="vgrid" id="grid"></div>
  <div class="more" id="more"></div>`;

/* ---------- 篩選（存在 URL query string） ---------- */
const filters = {
  verdict: params.get('verdict') || '',
  class_id: params.get('class_id') ?? '',
  ai: params.get('ai') || '',
  ai_cmp: params.get('ai_cmp') || '',
};
const match = (it, skip) => matchFilters(it, filters, skip);

// 類別很多：缺點類別、AI 結果只顯示張數最多的幾個，其餘用搜尋選取
const COMPACT = { class_id: 8, ai: 8 };
function renderFilters() {
  for (const key of FILTER_KEYS) {
    const f = FACETS[key];
    const base = items.filter(it => match(it, key));
    const counted = f.opts.map(o => ({ ...o, n: base.reduce((a, it) => a + (f.test(it, o.v) ? 1 : 0), 0) }));
    let visible = counted;
    if (COMPACT[key]) {
      const top = counted.filter(o => o.n > 0 && o.v !== 'OK').sort((x, y) => y.n - x.n).slice(0, COMPACT[key]);
      visible = counted.filter(o => o.v === 'OK' || o.v === filters[key] || top.includes(o));
    }
    const all = `<button class="chip ${!filters[key] ? 'active' : ''}" data-k="${key}" data-v="">全部 <span class="cnt">${fmt(base.length)}</span></button>`;
    const chips = visible.map(o => `<button class="chip ${filters[key] === o.v ? 'active' : ''} ${o.n ? '' : 'zero'} ${o.inactive ? 'inactive' : ''}" data-k="${key}" data-v="${o.v}" ${key === 'ai_cmp' ? `title="${AI_CMP[o.v].tip}"` : ''}>
        ${o.color ? `<span class="sw" style="background:${o.color}"></span>` : ''}<span class="nm">${o.label}</span> <span class="cnt">${fmt(o.n)}</span></button>`).join('');
    const more = COMPACT[key] ? `<span class="fcombo" id="fc-${key}"></span>` : '';
    $('f-' + key).innerHTML = all + chips + more;
    if (COMPACT[key]) {
      mountCombo($('fc-' + key), {
        placeholder: `搜尋其他類別（共 ${CLASSES.length} 種）…`,
        items: () => counted.filter(o => o.v !== 'OK').map(o => ({ v: o.v, label: o.label, sub: CLASSES[+o.v].name, color: o.color, count: o.n, inactive: o.inactive })),
        onPick: (v) => { filters[key] = v; applyFilters(true); },
      });
    }
  }
}
document.querySelector('.filters').onclick = (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  filters[b.dataset.k] = filters[b.dataset.k] === b.dataset.v ? '' : b.dataset.v;
  applyFilters(true);
};
$('clearBtn').onclick = () => { for (const k in filters) filters[k] = ''; applyFilters(true); };

function syncUrl() {
  const q = new URLSearchParams({ lot: LOT });
  for (const k of Object.keys(filters)) if (filters[k] !== '') q.set(k, filters[k]);
  history.replaceState(null, '', '?' + q.toString());
}

/* ---------- 虛擬捲動 + 模擬 cursor 分頁 ---------- */
const PAGE = 200, GAP = 12, INFO_H = 62;
const DENSITY = { s: 150, m: 210, l: 300 };
let density = 'm';
try { density = localStorage.getItem('dl_density') || 'm'; } catch {}
let filtered = [], loaded = 0, loading = false, geo = {};
const grid = () => $('grid');

function applyFilters(scrollTop) {
  syncUrl();
  renderFilters();
  filtered = items.filter(it => match(it));
  loaded = Math.min(PAGE, filtered.length);
  const active = Object.values(filters).some(v => v !== '');
  $('resultTxt').innerHTML = `符合 <b>${fmt(filtered.length)}</b> 張`;
  $('clearBtn').style.display = active ? '' : 'none';
  if (scrollTop) window.scrollTo({ top: Math.min(scrollY, grid().offsetTop - 140) });
  render();
}

function layout() {
  const w = grid().clientWidth;
  const min = DENSITY[density];
  const cols = Math.max(1, Math.floor((w + GAP) / (min + GAP)));
  const cardW = (w - GAP * (cols - 1)) / cols;
  const thumbH = cardW * H / W;
  geo = { cols, cardW, thumbH, rowH: thumbH + INFO_H + GAP };
}

function cardHtml(it, r, c) {
  const cf = filters.class_id;
  const boxes = it.defects.map(d => {
    const cl = CLASSES[d.class_id], b = d.bbox;
    return `<i class="bx ${cf !== '' && d.class_id !== +cf ? 'dim' : ''}" style="left:${b.x / W * 100}%;top:${b.y / H * 100}%;width:${b.w / W * 100}%;height:${b.h / H * 100}%;border-color:${cl.color}"></i>`;
  }).join('');
  return `<div class="item" data-id="${it.id}" style="top:${r * geo.rowH}px;left:${c * (geo.cardW + GAP)}px;width:${geo.cardW}px">
    <div class="thumb" style="height:${geo.thumbH}px">
      <img src="${THUMBS[it.thumb]}" alt="" loading="lazy" draggable="false">${boxes}
      ${it.lockedBy ? `<span class="lock">🔒 ${it.lockedBy} 編輯中</span>` : ''}
      <span class="idx">#${fmt(it.idx)}</span>
    </div>
    <div class="info">
      <div class="r1"><span class="fn mono">${it.filename}</span><span class="nbx">${it.defects.length ? it.defects.length + ' 框' : ''}</span></div>
      <div class="r2"><span class="badge ${VERDICT[it.verdict].cls}">${VERDICT[it.verdict].label}</span><span class="ai" title="AI 分類結果與信心分數${it.aiCmp ? '｜' + AI_CMP[it.aiCmp].tip : ''}">AI：${aiLabel(it.ai)} <span class="sc">${it.aiScore.toFixed(2)}</span>${it.aiCmp ? ` · <b style="color:${AI_CMP[it.aiCmp].color}">${AI_CMP[it.aiCmp].label}</b>` : ''}</span></div>
    </div>
  </div>`;
}

let raf = 0;
function render() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const g = grid();
    g.classList.toggle('hide-boxes', !$('showBoxes').checked);
    if (!filtered.length) {
      g.style.height = 'auto';
      g.innerHTML = `<div class="panel empty">沒有符合條件的圖片<br><button class="btn btn-ghost" onclick="$('clearBtn').click()">清除篩選</button></div>`;
      $('more').innerHTML = '';
      return;
    }
    layout();
    const rows = Math.ceil(loaded / geo.cols);
    g.style.height = (rows * geo.rowH - GAP) + 'px';
    const top = g.getBoundingClientRect().top;
    const first = Math.max(0, Math.floor(-top / geo.rowH) - 2);
    const last = Math.min(rows - 1, Math.ceil((innerHeight - top) / geo.rowH) + 2);
    let html = '';
    for (let r = first; r <= last; r++)
      for (let c = 0; c < geo.cols; c++) {
        const i = r * geo.cols + c;
        if (i < loaded) html += cardHtml(filtered[i], r, c);
      }
    g.innerHTML = html;

    if (loaded < filtered.length) {
      $('more').innerHTML = `<span class="spinner dark"></span>已載入 ${fmt(loaded)} / ${fmt(filtered.length)}，捲動載入更多…`;
      if (last >= rows - 3) loadMore();
    } else {
      $('more').innerHTML = `已顯示全部 ${fmt(filtered.length)} 張`;
    }
  });
}
function loadMore() {
  if (loading) return;
  loading = true;
  setTimeout(() => { loaded = Math.min(filtered.length, loaded + PAGE); loading = false; render(); }, 350);
}

window.addEventListener('scroll', render, { passive: true });
window.addEventListener('resize', render);
$('showBoxes').onchange = render;
const segBtns = document.querySelectorAll('#density button');
function setDensity(d) {
  density = d; segBtns.forEach(b => b.classList.toggle('on', b.dataset.d === d));
  try { localStorage.setItem('dl_density', d); } catch {}
  render();
}
segBtns.forEach(b => b.onclick = () => setDensity(b.dataset.d));
setDensity(density);

grid().onclick = (e) => {
  const el = e.target.closest('.item'); if (!el) return;
  const it = items.find(x => x.id === el.dataset.id);
  const q = new URLSearchParams(location.search); q.set('id', it.id);
  location.href = 'annotate.html?' + q.toString();
};

function startQueue() {
  const it = items.find(x => x.verdict === 'none' && !x.lockedBy);
  if (!it) { toast('這個 Lot 已經沒有待標註的圖'); return; }
  location.href = `annotate.html?lot=${encodeURIComponent(LOT)}&id=${it.id}&queue=1`;
}

if (GO_QUEUE) startQueue(); else applyFilters(false);
</script>
</body>
</html>
